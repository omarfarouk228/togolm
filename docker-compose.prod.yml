services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-togolm}
      POSTGRES_USER: ${POSTGRES_USER:-togolm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-togolm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    expose:
      - "8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      API_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: >
      celery -A corpus.celery_app worker
      --loglevel=info
      --concurrency=2
      -Q celery
    volumes:
      # Spider output survives redeploys (it lived in the container layer before).
      - datasets:/app/corpus/datasets
    labels:
      # Never route HTTP traffic here. On 2026-10-09 Coolify had api.togolm.com
      # assigned to the worker and beat too; once the worker became healthy,
      # Traefik started sending API requests to it and the API returned 502.
      - traefik.enable=false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # The image's default HEALTHCHECK curls the API port, which a worker never
    # serves, so workers were always reported "unhealthy". Ping Celery instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A corpus.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    user: root
    command: >
      celery -A corpus.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
      --schedule /app/data/celerybeat-schedule
    volumes:
      - beatdata:/app/data
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Beat serves nothing to probe; disable the image's API-port HEALTHCHECK.
    # Only ONE beat may ever run, or every scheduled task fires twice.
    healthcheck:
      disable: true
    labels:
      - traefik.enable=false  # see celery-worker

volumes:
  pgdata:
  redisdata:
  beatdata:
  datasets:
